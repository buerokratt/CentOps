version: '3.9'
services:
  ruuter-private:
    container_name: ruuter-private
    image: ruuter
    depends_on:
      - vault-agent
    environment:
      - application.cors.allowedOrigins=http://localhost:8057,https://tim.buerokratt.ee
      - application.httpCodesAllowList=200,201,202,203,204,205,206,207,208,226
      - application.logging.displayRequestContent=true
      - application.logging.displayResponseContent=true
      - server.port=8050
      - application.DSL.processedFiletypes=.yml,.yaml,.tmp
    volumes:
      - ./DSL/Ruuter.private:/DSL
    ports:
      - 8050:8050
    networks:
      - bykstack

  ruuter-public:
    container_name: ruuter-public
    image: ruuter
    environment:
      - application.cors.allowedOrigins=http://localhost:8058,https://tim.buerokratt.ee
      - application.httpCodesAllowList=200,201,202,203,204,205,206,207,208,226
      - application.logging.displayRequestContent=true
      - application.logging.displayResponseContent=true
      - server.port=8051
      - application.DSL.processedFiletypes=.yml,.yaml,.tmp
    volumes:
      - ./DSL/Ruuter.public:/DSL
    ports:
      - 8051:8051
    networks:
      - bykstack

  resql:
    container_name: resql
    image: resql
    depends_on:
      - database
      - vault-agent
    environment:
      - logging.level.org.springframework.boot=INFO
      - server.port=8052
    env_file:
      - "${VAULT_DATA_PATH}/resql.env"
    ports:
      - 8052:8052
    volumes:
      - ./DSL/Resql/centops:/workspace/app/templates/centops
    networks:
      - bykstack

  resql-users:
    container_name: resql-users
    image: resql
    depends_on:
      - database
      - vault-agent
    env_file:
      - "${VAULT_DATA_PATH}/resql-users.env"
    environment:
      - server.port=8059
      - logging.level.org.springframework.boot=INFO
    ports:
      - 8059:8059
    volumes:
      - ./DSL/Resql/users:/workspace/app/templates/users
    networks:
      - bykstack    

  database:
    container_name: database
    image: postgres:14.1
    depends_on:
      - vault-agent
    env_file:
      - "${VAULT_DATA_PATH}/database.env"
    ports:
      - 8053:5432
    volumes:
      - ./data:/var/lib/postgresql/data
      - ./init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh
    networks:
      - bykstack

  data_mapper:
    container_name: data_mapper
    image: datamapper
    environment:
      - PORT=8054
      - CONTENT_FOLDER=/data
    volumes:
      - ./DSL/DMapper/hbs:/workspace/app/views/centops
      - ./DSL/DMapper/js:/workspace/app/js/centops
      - ./DSL/DMapper/lib:/workspace/app/lib
      - ./DSL/Data/Forms:/data/forms
      - ./DSL/Data/Validation:/data/validators
    ports:
      - 8054:8054
    networks:
      - bykstack

  tim:
    container_name: tim
    image: tim
    depends_on:
      - tim-postgresql
    ports:
      - 8055:8055
    networks:
      - bykstack
    extra_hosts:
      - "host.docker.internal:host-gateway"

  tim-postgresql:
    container_name: tim-postgresql
    image: postgres:14.1
    depends_on:
      - vault-agent
    env_file:
      - "${VAULT_DATA_PATH}/tim-postgresql.env"
    volumes:
      - ./tim-db:/var/lib/postgresql/data
    ports:
      - 8056:5432
    networks:
      - bykstack

  gui_dev_private:
    container_name: gui_dev_private
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - REACT_APP_API_URL=http://localhost:8050
      - REACT_APP_PUBLIC_URL=http://localhost:8058
      - PORT=8057
    build:
      context: ./GUI.private
      dockerfile: Dockerfile.dev
    ports:
      - 8057:8057
    volumes:
      - /app/node_modules
      - ./GUI.private:/app
    networks:
      - bykstack

  gui_dev_public:
    container_name: gui_dev_public
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - REACT_APP_API_URL=http://localhost:8051
      - PORT=8058
    build:
      context: ./GUI.public
      dockerfile: Dockerfile.dev
    ports:
      - 8058:8058
    volumes:
      - /app/node_modules
      - ./GUI.public:/app
    networks:
      - bykstack

  vault:
    image: hashicorp/vault:latest
    container_name: vault
    restart: always
    ports:
      - "8200:8200"
    environment:
      VAULT_ADDR: "http://0.0.0.0:8200"
    volumes:
      - ./vault/config.hcl:/vault/config/config.hcl
      - "${VAULT_DATA_PATH}/data:/vault/data"
    entrypoint: >
      vault server -config=/vault/config/config.hcl
    cap_add:
      - IPC_LOCK

  vault-agent:
    image: hashicorp/vault:1.18
    container_name: vault-agent
    depends_on:
      - vault
    cap_add:
      - IPC_LOCK
    volumes:
      - ./vault/vault-agent.hcl:/vault/vault-agent.hcl
      - ./vault/templates/resql-template.ctmpl:/vault/templates/resql-template.ctmpl
      - ./vault/templates/resql-users-template.ctmpl:/vault/templates/resql-users-template.ctmpl
      - ./vault/templates/database-template.ctmpl:/vault/templates/database-template.ctmpl
      - ./vault/templates/tim-postgresql-template.ctmpl:/vault/templates/tim-postgresql-template.ctmpl
      - "${VAULT_DATA_PATH}/.vault-token:/vault/secrets/.vault-token:ro"
      - "${VAULT_DATA_PATH}:/vault/secrets"
    command: vault agent -config=/vault/vault-agent.hcl

  vault-unseal:
    image: curlimages/curl:latest
    container_name: vault-unseal-tool
    depends_on:
      - vault
    environment:
      VAULT_UNSEAL_KEY: ${VAULT_UNSEAL_KEY}
    entrypoint: sh
    command: -c '
      echo "Waiting for Vault to be started...";
      until curl --silent http://vault:8200/v1/sys/health | grep -q "\"initialized\":true"; do
      sleep 2;
      done;
      echo "Sending unseal key...";
      curl --silent --request PUT --data "{\"key\":\"$VAULT_UNSEAL_KEY\"}" http://vault:8200/v1/sys/unseal;
      echo "Vault Unseal done.";'

    restart: "no"

volumes:
  opensearch-data1:
  vault-data:


networks:
  bykstack:
    name: bykstack
    driver: bridge
