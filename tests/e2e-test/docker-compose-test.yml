services:
  ruuter-test:
    container_name: ruuter-test
    image: ruuter
    depends_on:
      - vault-agent
    environment:
      - application.cors.allowedOrigins=http://localhost:9057
      - application.httpCodesAllowList=200,201,202,203,204,205,206,207,208,226
      - application.logging.displayRequestContent=true
      - application.logging.displayResponseContent=true
      - server.port=9050
      - application.DSL.processedFiletypes=.yml,.yaml,.tmp
      - application.incomingRequests.allowedMethodTypes=GET,POST,PUT,DELETE
    volumes:
      - ../../DSL/Ruuter:/DSL
      - ./constants.ini:/app/constants.ini
    ports:
      - 9050:9050
    networks:
      - bykstack-test

  resql-test:
    container_name: resql-test
    image: resql
    depends_on:
      - database-test
      - vault-agent
    environment:
      - logging.level.org.springframework.boot=INFO
      - server.port=9052
      - sqlms.datasources.[0].jdbcUrl=jdbc:postgresql://database-test:5432/centops_db
    env_file:
      - "${VAULT_DATA_PATH}/resql.env"
    ports:
      - 9052:9052
    volumes:
      - ../../DSL/Resql:/DSL
    networks:
      - bykstack-test

  database-test:
    container_name: database-test
    image: postgres:14.1
    depends_on:
      - vault-agent
    env_file:
      - "${VAULT_DATA_PATH}/database.env"
    ports:
      - 9053:5432
    volumes:
      - ./data:/var/lib/postgresql/data
      - ../../init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh
    networks:
      - bykstack-test

  data-mapper-test:
    container_name: data-mapper-test
    image: data-mapper
    environment:
      - PORT=9054
      - CONTENT_FOLDER=/data
    volumes:
      - ../../DSL/DMapper/centops/hbs:/workspace/app/views/centops
      - ../../DSL/DMapper/centops/js:/workspace/app/js/centops
      - ../../DSL/Data/Forms:/data/forms
      - ../../DSL/Data/Validation:/data/validators
    ports:
      - 9054:9054
    networks:
      - bykstack-test

  tim-mock-test:
    container_name: tim-mock-test
    build: ./tim-mock
    environment:
      - PORT=9085
    ports:
      - "9085:9085"
    networks:
      - bykstack-test

  vault:
    image: hashicorp/vault:1.18
    container_name: vault-test
    restart: on-failure
    ports:
      - "9200:9200"
    environment:
      VAULT_ADDR: "http://0.0.0.0:9200"
    volumes:
      - ./vault/config.hcl:/vault/config/config.hcl
      - "${VAULT_DATA_PATH}/data:/vault/data"
    entrypoint: >
      vault server -config=/vault/config/config.hcl
    cap_add:
      - IPC_LOCK
    networks:
      - bykstack-test

  vault-agent:
    image: hashicorp/vault:1.18
    container_name: vault-agent-test
    depends_on:
      - vault
    cap_add:
      - IPC_LOCK
    volumes:
      - ../../vault/vault-agent.hcl:/vault/vault-agent.hcl
      - ../../vault/templates/resql-template.ctmpl:/vault/templates/resql-template.ctmpl
      - ../../vault/templates/resql-users-template.ctmpl:/vault/templates/resql-users-template.ctmpl
      - ../../vault/templates/database-template.ctmpl:/vault/templates/database-template.ctmpl
      - ../../vault/templates/tim-postgresql-template.ctmpl:/vault/templates/tim-postgresql-template.ctmpl
      - "${VAULT_DATA_PATH}/.vault-token:/vault/secrets/.vault-token:ro"
      - "${VAULT_DATA_PATH}:/vault/secrets"
    command: vault agent -config=/vault/vault-agent.hcl
    networks:
      - bykstack-test

  vault-unseal:
    image: alpine:3.20
    container_name: vault-unseal-tool-test
    depends_on:
      - vault
    networks:
      - bykstack-test
    environment:
      VAULT_UNSEAL_KEY: ${VAULT_UNSEAL_KEY}
    entrypoint: sh
    command: -c '
      apk add --no-cache curl jq;
      
      echo "Waiting for Vault to be initialized...";
      until [ "$(curl -s http://vault:9200/v1/sys/health | jq -r ".initialized")" = "true" ]; do
      sleep 2;
      done;
      
      echo "Checking if Vault is already unsealed...";
      if [ "$(curl -s http://vault:9200/v1/sys/health | jq -r '.sealed')" = "false" ]; then
      echo "Vault is already unsealed. Skipping unseal step.";
      exit 0;
      fi;
      
      echo "Sending unseal key...";
      curl --silent --request PUT --data "{\"key\":\"$VAULT_UNSEAL_KEY\"}" http://vault:9200/v1/sys/unseal;
      echo "Vault Unseal done.";'
    restart: "no"

  liquibase-test:
    container_name: liquibase-test
    image: liquibase/liquibase
    networks:
      - bykstack-test
    depends_on:
      - database-test
    volumes:
      - ../../DSL/Liquibase/:/liquibase/changelog/
      - ./liquibase.properties/:/liquibase/changelog/liquibase.properties
    command: --defaultsFile=/liquibase/changelog/liquibase.properties update
    restart: "no"

volumes:
  opensearch-data1:
  vault-data:

networks:
  bykstack-test:
    name: bykstack-test
    driver: bridge
