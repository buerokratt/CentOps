declaration:
  call: declare
  version: 0.1
  description: "Create a new cluster"
  method: post
  accepts: json
  returns: json
  namespace: centops
  allowlist:
    body:
      - field: name
        type: string
      - field: ipAddress
        type: string
      - field: argoApiUrl
        type: string

get_user_info:
  call: http.post
  args:
    url: "[#CENTOPS_TIM]/jwt/custom-jwt-userinfo"
    contentType: plaintext
    headers:
      cookie: "customJwtCookie=${incoming.headers.cookie}"
    plaintext:
      "customJwtCookie"
  result: user_info_response
  next: check_user_info_response

check_user_info_response:
  switch:
    - condition: ${200 <= user_info_response.response.statusCodeValue && user_info_response.response.statusCodeValue < 300}
      next: assign_user_data
  next: return_incorrect_request

assign_user_data:
  assign:
    userIdCode: ${user_info_response.response.body.idCode}
    firstName: ${user_info_response.response.body.firstName}
    lastName: ${user_info_response.response.body.lastName}
  next: extract_request_data

extract_request_data:
  assign:
    name: ${incoming.body.name}
    ip_address: ${incoming.body.ipAddress}
    argo_api_url: ${incoming.body.argoApiUrl}
  next: validate_input

validate_input:
  switch:
    - condition: ${name == null || ip_address == null || argo_api_url == null}
      next: return_bad_request
  next: create_log

create_log:
  call: http.post
  args:
    url: "[#CENTOPS_RESQL]/create-user-log"
    body:
      method: "POST"
      path: "admin/clusters"
      user_id_code: ${userIdCode}
      first_name: ${firstName}
      last_name: ${lastName}
  result: create_result
  next: create_cluster

create_cluster:
  call: http.post
  args:
    url: "[#CENTOPS_RESQL]/create-cluster"
    body:
      name: ${name}
      ip_address: ${ip_address}
      argo_api_url: ${argo_api_url}
  result: create_result
  next: return_created

return_created:
  status: 201
  return: "Cluster created successfully"
  next: end

return_bad_request:
  status: 400
  return: "Name, IP address, Argo API URL and token are required"
  next: end