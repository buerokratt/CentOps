declaration:
  call: declare
  version: 0.1
  description: "Create a new cluster"
  method: post
  accepts: json
  returns: json
  namespace: centops
  allowlist:
    body:
      - field: name
        type: string
      - field: ipAddress
        type: string
    headers:
      - field: cookie
        type: string

validate_request_param:
  switch:
    - condition: ${incoming.body.name == null || incoming.body.ipAddress == null || incoming.headers == null || incoming.headers.cookie == null}
      next: return_bad_request
  next: assign_parameters

assign_parameters:
  assign:
    name: ${incoming.body.name}
    ip_address: ${incoming.body.ipAddress}
  next: call_create_user_log_template

call_create_user_log_template:
  template: "[#CENTOPS_PROJECT_LAYER]/log-user-request"
  requestType: templates
  body:
    method: "POST"
    path: "admin/clusters"
  headers:
    cookie: ${incoming.headers.cookie}
  result: log_result
  next: send_request

send_request:
  call: http.post
  args:
    url: "[#CENTOPS_RESQL]/create-cluster"
    body:
      name: ${name}
      ip_address: ${ip_address}
  result: create_result
  next: return_created

return_created:
  status: 201
  return: "Cluster created successfully"
  next: end

return_bad_request:
  status: 400
  return: "name, ipAddress and cookie are required"
  next: end