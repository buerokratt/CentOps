declaration:
  call: declare
  version: 0.1
  description: "Create a new client"
  method: post
  accepts: json
  returns: json
  namespace: centops
  endpoint: /clients
  allowlist:
    body:
      - field: name
        type: string
      - field: kubernetesClusterAddress
        type: string
      - field: kubernetesClusterNamespace
        type: string
      - field: argoAppDeploymentName
        type: string
      - field: authenticationCertificate
        type: string
    headers:
      - field: cookie
        type: string
        description: "Cookie field"

extract_request_data:
  assign:
    name: ${incoming.body.name}
    kubernetes_cluster_address: ${incoming.body.kubernetesClusterAddress}
    kubernetes_cluster_namespace: ${incoming.body.kubernetesClusterNamespace}
    argo_app_deployment_name: ${incoming.body.argoAppDeploymentName}
    authentication_certificate: ${incoming.body.authenticationCertificate}
  next: validate_input

validate_input:
  switch:
    - condition: ${name == null || kubernetes_cluster_address == null || kubernetes_cluster_namespace == null || argo_app_deployment_name == null || authentication_certificate == null || incoming.headers == null || incoming.headers.cookie == null}
      next: return_bad_request
  next: call_create_user_log_template

call_create_user_log_template:
  template: "[#CENTOPS_PROJECT_LAYER]/log-user-request"
  requestType: templates
  body:
    method: "POST"
    path: "admin/clients"
  headers:
    cookie: ${incoming.headers.cookie}
  result: log_result
  next: create_client

create_client:
  call: http.post
  args:
    url: "[#CENTOPS_RESQL]/create-client"
    body:
      name: ${name}
      kubernetes_cluster_address: ${kubernetes_cluster_address}
      kubernetes_cluster_namespace: ${kubernetes_cluster_namespace}
      authentication_certificate: ${authentication_certificate}
      argo_app_deployment_name: ${argo_app_deployment_name}
      created_at: ${new Date().toISOString()}
  result: create_result
  next: return_created_client

return_created_client:
  status: 201
  return: "Client created successfully"
  next: end

return_bad_request:
  status: 400
  return: "All fields and cookie are required"
  next: end