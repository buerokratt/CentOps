declaration:
  call: declare
  version: 0.1
  description: "Create documentation"
  method: post
  accepts: json
  returns: json
  namespace: centops
  allowlist:
    body:
      - field: content
        type: string
    headers:
      - field: cookie
        type: string
        description: "Cookie field"

extract_request_data:
  assign:
    content: ${incoming.body.content}
  next: validate_input

validate_input:
  switch:
    - condition: ${content == null || incoming.headers == null || incoming.headers.cookie == null}
      next: return_bad_request
  next: call_create_user_log_template

call_create_user_log_template:
  template: "[#CENTOPS_PROJECT_LAYER]/log-user-request"
  requestType: templates
  body:
    method: "POST"
    path: "admin/documentations"
  headers:
    cookie: ${incoming.headers.cookie}
  result: log_result
  next: create_documentation

create_documentation:
  call: http.post
  args:
    url: "[#CENTOPS_RESQL]/create-documentation"
    body:
      content: ${content}
  result: create_result
  next: return_created

return_created:
  status: 201
  return: "Documentation created successfully"
  next: end

return_bad_request:
  status: 400
  return: "Content and cookie are required"
  next: end