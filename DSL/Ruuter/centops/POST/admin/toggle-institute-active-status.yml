declaration:
  call: declare
  version: 0.1
  description: "Decription placeholder for 'toggle-institute-active-status'"
  method: post
  accepts: json
  returns: json
  namespace: centops
  allowlist:
    body:
      - field: id
        type: string
        description: "Params field 'id'"

check_body:
  switch:
    - condition: ${incoming.params == null || incoming.params.id == null}
      next: return_incorrect_request

toggle_institution_status:
  call: http.post
  args:
    url: "[#CENTOPS_RESQL]/toggle-institute-active-status"
    body:
      id: ${incoming.params.id}
  result: institution

return_success:
  status: 200
  return: "Institution saved successfully"
  next: end

return_incorrect_request:
  status: 400
  return: "Missing required parameters"
  next: end
