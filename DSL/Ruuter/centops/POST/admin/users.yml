declaration:
  call: declare
  version: 0.1
  description: "Create a new user"
  method: post
  accepts: json
  returns: json
  namespace: centops
  allowlist:
    body:
      - field: firstName
        type: string
      - field: lastName
        type: string
      - field: idCode
        type: string

get_user_info:
  call: http.post
  args:
    url: "[#CENTOPS_TIM]/jwt/custom-jwt-userinfo"
    contentType: plaintext
    headers:
      cookie: "customJwtCookie=${incoming.headers.cookie}"
    plaintext:
      "customJwtCookie"
  result: user_info_response
  next: check_user_info_response

check_user_info_response:
  switch:
    - condition: ${200 <= user_info_response.response.statusCodeValue && user_info_response.response.statusCodeValue < 300}
      next: assign_user_data
  next: return_incorrect_request

assign_user_data:
  assign:
    userIdCode: ${user_info_response.response.body.idCode}
    firstName: ${user_info_response.response.body.firstName}
    lastName: ${user_info_response.response.body.lastName}
  next: extract_request_data

extract_request_data:
  assign:
    first_name: ${incoming.body.firstName}
    last_name: ${incoming.body.lastName}
    id_code: ${incoming.body.idCode}
  next: validate_input

validate_input:
  switch:
    - condition: ${first_name == null || last_name == null || id_code == null}
      next: return_bad_request
  next: create_log

create_log:
  call: http.post
  args:
    url: "[#CENTOPS_RESQL]/create-user-log"
    body:
      method: "POST"
      path: "admin/users"
      user_id_code: ${userIdCode}
      first_name: ${firstName}
      last_name: ${lastName}
  result: create_user

create_user:
  call: http.post
  args:
    url: "[#CENTOPS_RESQL]/create-user"
    body:
      first_name: ${first_name}
      last_name: ${last_name}
      id_code: ${id_code}
  result: create_result
  next: return_created_user

return_created_user:
  status: 201
  return: "User created successfully"
  next: end

return_bad_request:
  status: 400
  return: "First name, last name and ID code are required"
  next: end