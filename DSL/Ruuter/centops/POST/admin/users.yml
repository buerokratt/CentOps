declaration:
  call: declare
  version: 0.1
  description: "Create a new user"
  method: post
  accepts: json
  returns: json
  namespace: centops
  allowlist:
    body:
      - field: firstName
        type: string
      - field: lastName
        type: string
      - field: idCode
        type: string
    headers:
      - field: cookie
        type: string
        description: "Cookie field"

extract_request_data:
  assign:
    first_name: ${incoming.body.firstName}
    last_name: ${incoming.body.lastName}
    id_code: ${incoming.body.idCode}
  next: validate_input

validate_input:
  switch:
    - condition: ${first_name == null || last_name == null || id_code == null || incoming.headers == null || incoming.headers.cookie == null}
      next: return_bad_request
  next: call_create_user_log_template

call_create_user_log_template:
  template: "[#CENTOPS_PROJECT_LAYER]/log-user-request"
  requestType: templates
  body:
    method: "POST"
    path: "admin/users"
  headers:
    cookie: ${incoming.headers.cookie}
  result: log_result
  next: create_user

create_user:
  call: http.post
  args:
    url: "[#CENTOPS_RESQL]/create-user"
    body:
      first_name: ${first_name}
      last_name: ${last_name}
      id_code: ${id_code}
  result: create_result
  next: return_created_user

return_created_user:
  status: 201
  return: "User created successfully"
  next: end

return_bad_request:
  status: 400
  return: "First name, last name and ID code and cookie are required"
  next: end