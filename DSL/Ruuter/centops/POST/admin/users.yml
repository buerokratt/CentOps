declaration:
  call: declare
  version: 0.1
  description: "Create a new user"
  method: post
  accepts: json
  returns: json
  namespace: centops
  allowlist:
    body:
      - field: firstName
        type: string
      - field: lastName
        type: string
      - field: idCode
        type: string
    headers:
      - field: cookie
        type: string
      - field: x-forwarded-for
        type: string

validate_request_param:
  switch:
    - condition: ${incoming.body.firstName == null || incoming.body.lastName == null || incoming.body.idCode == null || incoming.headers == null || incoming.headers.cookie == null}
      next: return_bad_request
  next: assign_parameters

assign_parameters:
  assign:
    first_name: ${incoming.body.firstName}
    last_name: ${incoming.body.lastName}
    id_code: ${incoming.body.idCode}
    ip_address: ${incoming.headers[Object.keys(incoming.headers).find(h => h.toLowerCase() === 'x-forwarded-for')] || 'unknown'}
  next: call_create_user_log_template

call_create_user_log_template:
  template: "[#CENTOPS_PROJECT_LAYER]/log-user-request"
  requestType: templates
  body:
    method: "POST"
    path: "admin/users"
    ip_address: ${ip_address}
  headers:
    cookie: ${incoming.headers.cookie}
  result: log_result
  next: send_request

send_request:
  call: http.post
  args:
    url: "[#CENTOPS_RESQL]/create-user"
    body:
      first_name: ${first_name}
      last_name: ${last_name}
      id_code: ${id_code}
  result: create_result
  next: return_created

return_created:
  status: 201
  return: "User created successfully"
  next: end

return_bad_request:
  status: 400
  return: "firstName, lastName, idCode and cookie are required"
  next: end