declaration:
  call: declare
  version: 0.1
  description: "Decription placeholder for 'get-inbox-messages'"
  method: post
  accepts: json
  returns: json
  namespace: centops
  allowlist:
    headers:
      - field: cookie
        type: string
        description: "Cookie field"

get_user_info:
  call: http.post
  args:
   url: "[#CENTOPS_TIM]/jwt/custom-jwt-userinfo"
   contentType: plaintext
   headers:
    cookie: ${incoming.headers.cookie}
   plaintext: 
      "customJwtCookie"
  result: res
  next: check_user_info_response

check_user_info_response:
  switch:
    - condition: ${200 <= res.response.statusCodeValue && res.response.statusCodeValue < 300}
      next: assign_id_code
  next: return_incorrect_request

assign_id_code:
  assign:
    user_id: ${res.response.body.idCode}

fetch_inbox_messages:
  call: http.post
  args:
    url: "[#CENTOPS_RESQL]/get-inbox-messages"
    body: 
      user_id: ${user_id}
  result: decryptedMessagesResult

mark_inbox_as_received:
  call: http.post
  args:
    url: "[#CENTOPS_RESQL]/mark-inbox-messages-as-received"
    body: 
      user_id: ${user_id}
  result: receivedMessagesResult

decrpyt_messages:
  call: http.post
  args:
    url: "[#CENTOPS_DMAPPER_HBS]/decrypt-messages"
    headers:
      type: "json"
    body:
      entries: ${decryptedMessagesResult.response.body}
  result: messagesResult

return_ok:
  wrapper: false
  status: 200
  return: ${messagesResult.response.body}
  next: end

return_incorrect_request:
  status: 400
  return: "Incorrect request"
  next: end
