declaration:
  call: declare
  version: 0.1
  description: "Update client details"
  method: put
  accepts: json
  returns: json
  namespace: centops
  endpoint: /clients/{name}
  allowlist:
    body:
      - field: name
        type: string
      - field: kubernetesClusterAddress
        type: string
      - field: kubernetesClusterNamespace
        type: string
      - field: argoAppDeploymentName
        type: string
      - field: authenticationCertificate
        type: string
    headers:
      - field: cookie
        type: string
        description: "Cookie field"

get_user_info:
  call: http.post
  args:
    url: "[#CENTOPS_TIM]/jwt/custom-jwt-userinfo"
    contentType: plaintext
    headers:
      cookie: "customJwtCookie=${incoming.headers.cookie}"
    plaintext:
      "customJwtCookie"
  result: user_info_response
  next: check_user_info_response

check_user_info_response:
  switch:
    - condition: ${200 <= user_info_response.response.statusCodeValue && user_info_response.response.statusCodeValue < 300}
      next: assign_user_data
  next: return_incorrect_request

assign_user_data:
  assign:
    userIdCode: ${user_info_response.response.body.idCode}
    firstName: ${user_info_response.response.body.firstName}
    lastName: ${user_info_response.response.body.lastName}
  next: extract_request_data

extract_request_data:
  assign:
    param_name: ${incoming.params.name}
    body_name: ${incoming.body.name}
    kubernetes_cluster_address: ${incoming.body.kubernetesClusterAddress}
    kubernetes_cluster_namespace: ${incoming.body.kubernetesClusterNamespace}
    argo_app_deployment_name: ${incoming.body.argoAppDeploymentName}
    authentication_certificate: ${incoming.body.authenticationCertificate}
  next: validate_input

validate_input:
  switch:
    - condition: ${param_name == null || body_name == null || kubernetes_cluster_address == null || kubernetes_cluster_namespace == null || argo_app_deployment_name == null || authentication_certificate == null}
      next: return_bad_request
  next: create_log

create_log:
  call: http.post
  args:
    url: "[#CENTOPS_RESQL]/create-user-log"
    body:
      method: "PUT"
      path: "admin/clients"
      user_id_code: ${userIdCode}
      first_name: ${firstName}
      last_name: ${lastName}
  result: create_result
  next: update_client

update_client:
  call: http.post
  args:
    url: "[#CENTOPS_RESQL]/create-or-update-client"
    body:
      name: ${body_name}
      kubernetes_cluster_address: ${kubernetes_cluster_address}
      kubernetes_cluster_namespace: ${kubernetes_cluster_namespace}
      argo_app_deployment_name: ${argo_app_deployment_name}
      authentication_certificate: ${authentication_certificate}
      created: ${new Date().toISOString()}
  result: update_result
  next: return_updated_client

return_updated_client:
  status: 200
  return: ${update_result.response.body}
  next: end

return_bad_request:
  status: 400
  return: "Client name and all fields are required"
  next: end