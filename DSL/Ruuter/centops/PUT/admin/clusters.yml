declaration:
  call: declare
  version: 0.1
  description: "Update cluster details"
  method: put
  accepts: json
  returns: json
  namespace: centops
  allowlist:
    body:
      - field: name
        type: string
      - field: ipAddress
        type: string
    params:
      - field: clusterId
        type: string
    headers:
      - field: cookie
        type: string

validate_request_param:
  switch:
    - condition: ${incoming.params.clusterId == null || incoming.body.name == null || incoming.body.ipAddress == null || incoming.headers == null || incoming.headers.cookie == null}
      next: return_bad_request
  next: assign_parameters

assign_parameters:
  assign:
    cluster_id: ${incoming.params.clusterId}
    name: ${incoming.body.name}
    ip_address: ${incoming.body.ipAddress}
  next: call_create_user_log_template

call_create_user_log_template:
  template: "[#CENTOPS_PROJECT_LAYER]/log-user-request"
  requestType: templates
  body:
    method: "PUT"
    path: "admin/clusters"
  headers:
    cookie: ${incoming.headers.cookie}
  result: log_cluster
  next: send_request

send_request:
  call: http.post
  args:
    url: "[#CENTOPS_RESQL]/update-cluster"
    body:
      cluster_id: ${cluster_id}
      name: ${name}
      ip_address: ${ip_address}
  result: update_result
  next: return_updated

return_updated:
  status: 204
  return:
  next: end

return_bad_request:
  status: 400
  return: "clusterId, name, ipAddress and cookie are required"
  next: end