declaration:
  call: declare
  version: 0.1
  description: "Update user details"
  method: put
  accepts: json
  returns: json
  namespace: centops
  allowlist:
    body:
      - field: firstName
        type: string
      - field: lastName
        type: string
      - field: idCode
        type: string
    params:
      - field: userId
        type: string
    headers:
      - field: cookie
        type: string

validate_request_param:
  switch:
    - condition: ${incoming.params.userId == null || incoming.body.firstName == null || incoming.body.lastName == null || incoming.body.idCode == null || incoming.headers == null || incoming.headers.cookie == null}
      next: return_bad_request
  next: assign_parameters

assign_parameters:
  assign:
    user_id: ${incoming.params.userId}
    first_name: ${incoming.body.firstName}
    last_name: ${incoming.body.lastName}
    id_code: ${incoming.body.idCode}
  next: call_create_user_log_template

call_create_user_log_template:
  template: "[#CENTOPS_PROJECT_LAYER]/log-user-request"
  requestType: templates
  body:
    method: "PUT"
    path: "admin/users"
  headers:
    cookie: ${incoming.headers.cookie}
  result: log_result
  next: send_request

send_request:
  call: http.post
  args:
    url: "[#CENTOPS_RESQL]/update-user"
    body:
      user_id: ${user_id}
      first_name: ${first_name}
      last_name: ${last_name}
      id_code: ${id_code}
  result: update_result
  next: return_updated

return_updated:
  status: 204
  return:
  next: end

return_bad_request:
  status: 400
  return: "userId, firstName, lastName, idCode, and cookie are required"
  next: end