declaration:
  call: declare
  version: 0.1
  description: "Update user details"
  method: put
  accepts: json
  returns: json
  namespace: centops
  allowlist:
    body:
      - field: firstName
        type: string
      - field: lastName
        type: string
      - field: idCode
        type: string
    params:
      - field: userId
        type: string

get_user_info:
  call: http.post
  args:
    url: "[#CENTOPS_TIM]/jwt/custom-jwt-userinfo"
    contentType: plaintext
    headers:
      cookie: "customJwtCookie=${incoming.headers.cookie}"
    plaintext:
      "customJwtCookie"
  result: user_info_response
  next: check_user_info_response

check_user_info_response:
  switch:
    - condition: ${200 <= user_info_response.response.statusCodeValue && user_info_response.response.statusCodeValue < 300}
      next: assign_user_data
  next: return_incorrect_request

assign_user_data:
  assign:
    userIdCode: ${user_info_response.response.body.idCode}
    firstName: ${user_info_response.response.body.firstName}
    lastName: ${user_info_response.response.body.lastName}
  next: extract_request_data

extract_request_data:
  assign:
    user_id: ${incoming.params.userId}
    first_name: ${incoming.body.firstName}
    last_name: ${incoming.body.lastName}
    id_code: ${incoming.body.idCode}
  next: validate_input

validate_input:
  switch:
    - condition: ${user_id == null || first_name == null || last_name == null || id_code == null}
      next: return_bad_request
  next: create_log

create_log:
  call: http.post
  args:
    url: "[#CENTOPS_RESQL]/create-user-log"
    body:
      method: "PUT"
      path: "admin/users"
      user_id_code: ${userIdCode}
      first_name: ${firstName}
      last_name: ${lastName}
  result: create_result
  next: update_user

update_user:
  call: http.post
  args:
    url: "[#CENTOPS_RESQL]/update-user"
    body:
      user_id: ${user_id}
      first_name: ${first_name}
      last_name: ${last_name}
      id_code: ${id_code}
  result: update_result
  next: return_updated_user

return_updated_user:
  status: 204
  return:
  next: end

return_bad_request:
  status: 400
  return: "User ID, first name and last name are required"
  next: end