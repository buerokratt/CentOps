declaration:
  call: declare
  version: 0.1
  description: "Update user details"
  method: put
  accepts: json
  returns: json
  namespace: centops
  allowlist:
    body:
      - field: firstName
        type: string
      - field: lastName
        type: string
      - field: idCode
        type: string
    params:
      - field: userId
        type: string
    headers:
      - field: cookie
        type: string
        description: "Cookie field"

extract_request_data:
  assign:
    user_id: ${incoming.params.userId}
    first_name: ${incoming.body.firstName}
    last_name: ${incoming.body.lastName}
    id_code: ${incoming.body.idCode}
  next: validate_input

validate_input:
  switch:
    - condition: ${user_id == null || first_name == null || last_name == null || id_code == null || incoming.headers == null || incoming.headers.cookie == null}
      next: return_bad_request
  next: call_create_user_log_template

call_create_user_log_template:
  template: "[#CENTOPS_PROJECT_LAYER]/log-user-request"
  requestType: templates
  body:
    method: "PUT"
    path: "admin/users"
  headers:
    cookie: ${incoming.headers.cookie}
  result: log_result
  next: update_user

update_user:
  call: http.post
  args:
    url: "[#CENTOPS_RESQL]/update-user"
    body:
      user_id: ${user_id}
      first_name: ${first_name}
      last_name: ${last_name}
      id_code: ${id_code}
  result: update_result
  next: return_updated_user

return_updated_user:
  status: 204
  return:
  next: end

return_bad_request:
  status: 400
  return: "User ID, firstName and lastName, cookie are required"
  next: end