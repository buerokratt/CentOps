declaration:
  call: declare
  version: 0.1
  description: "Delete a cluster"
  method: delete
  accepts: json
  returns: json
  namespace: centops
  allowlist:
    params:
      - field: clusterId
        type: string
    headers:
      - field: cookie
        type: string
        description: "Cookie field"

extract_request_data:
  assign:
    cluster_id: ${incoming.params.clusterId}
  next: validate_input

validate_input:
  switch:
    - condition: ${cluster_id == null || incoming.headers == null || incoming.headers.cookie == null}
      next: return_bad_request
  next: call_create_user_log_template

call_create_user_log_template:
  template: "[#CENTOPS_PROJECT_LAYER]/log-user-request"
  requestType: templates
  body:
    method: "DELETE"
    path: "admin/clusters"
  headers:
    cookie: ${incoming.headers.cookie}
  result: log_cluster
  next: delete_cluster

delete_cluster:
  call: http.post
  args:
    url: "[#CENTOPS_RESQL]/delete-cluster"
    body:
      cluster_id: ${cluster_id}
  result: delete_result
  next: return_success

return_success:
  status: 204
  return:
  next: end

return_bad_request:
  status: 400
  return: "Cluster ID and cookie are required"
  next: end