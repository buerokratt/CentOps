declaration:
  call: declare
  version: 0.1
  description: "Delete a user log"
  method: delete
  accepts: json
  returns: json
  namespace: centops
  allowlist:
    params:
      - field: logId
        type: string

validate_request_param:
  switch:
    - condition: ${incoming.params.logId == null}
      next: return_bad_request
  next: assign_parameters

assign_parameters:
  assign:
    log_id: ${incoming.params.logId}
  next: send_request

send_request:
  call: http.post
  args:
    url: "[#CENTOPS_RESQL]/delete-user-log"
    body:
      log_id: ${log_id}
  result: delete_result
  next: return_success

return_success:
  status: 204
  return:
  next: end

return_bad_request:
  status: 400
  return: "logId is required"
  next: end