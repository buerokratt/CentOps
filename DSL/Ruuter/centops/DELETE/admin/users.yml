declaration:
  call: declare
  version: 0.1
  description: "Delete a user"
  method: delete
  accepts: json
  returns: json
  namespace: centops
  allowlist:
    params:
      - field: userId
        type: string

get_user_info:
  call: http.post
  args:
    url: "[#CENTOPS_TIM]/jwt/custom-jwt-userinfo"
    contentType: plaintext
    headers:
      cookie: "customJwtCookie=${incoming.headers.cookie}"
    plaintext:
      "customJwtCookie"
  result: user_info_response
  next: check_user_info_response

check_user_info_response:
  switch:
    - condition: ${200 <= user_info_response.response.statusCodeValue && user_info_response.response.statusCodeValue < 300}
      next: assign_user_data
  next: return_incorrect_request

assign_user_data:
  assign:
    userIdCode: ${user_info_response.response.body.idCode}
    firstName: ${user_info_response.response.body.firstName}
    lastName: ${user_info_response.response.body.lastName}
  next: validate_id_code

validate_id_code:
  switch:
    - condition: ${incoming.params.userId == null}
      next: return_bad_request
  next: create_log

create_log:
  call: http.post
  args:
    url: "[#CENTOPS_RESQL]/create-user-log"
    body:
      method: "DELETE"
      path: "admin/users"
      user_id_code: ${userIdCode}
      first_name: ${firstName}
      last_name: ${lastName}
  result: delete_user

delete_user:
  call: http.post
  args:
    url: "[#CENTOPS_RESQL]/delete-user"
    body:
      user_id: ${incoming.params.userId}
  result: delete_result
  next: return_deleted_user

return_deleted_user:
  status: 204
  return:
  next: end

return_bad_request:
  status: 400
  return: "User ID code is required"
  next: end