declaration:
  call: declare
  version: 0.1
  description: "Delete a user"
  method: delete
  accepts: json
  returns: json
  namespace: centops
  allowlist:
    params:
      - field: userId
        type: string
    headers:
      - field: cookie
        type: string
        description: "Cookie field"

validate_id_code:
  switch:
    - condition: ${incoming.params.userId == null || incoming.headers == null || incoming.headers.cookie == null}
      next: return_bad_request
  next: call_create_user_log_template

call_create_user_log_template:
  template: "[#CENTOPS_PROJECT_LAYER]/log-user-request"
  requestType: templates
  body:
    method: "DELETE"
    path: "admin/users"
  headers:
    cookie: ${incoming.headers.cookie}
  result: log_result
  next: delete_user

delete_user:
  call: http.post
  args:
    url: "[#CENTOPS_RESQL]/delete-user"
    body:
      user_id: ${incoming.params.userId}
  result: delete_result
  next: return_deleted_user

return_deleted_user:
  status: 204
  return:
  next: end

return_bad_request:
  status: 400
  return: "User ID code and cookie are required"
  next: end