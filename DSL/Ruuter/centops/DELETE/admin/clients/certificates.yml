declaration:
  call: declare
  version: 0.1
  description: "Delete a certificate"
  method: delete
  accepts: json
  returns: json
  namespace: centops
  allowlist:
    params:
      - field: clientId
        type: string
      - field: certificateId
        type: string
    headers:
      - field: cookie
        type: string
      - field: x-forwarded-for
        type: string

validate_request_param:
  switch:
    - condition: ${incoming.params.clientId == null || incoming.params.certificateId == null || incoming.headers == null || incoming.headers.cookie == null}
      next: return_bad_request
  next: assign_parameters

assign_parameters:
  assign:
    client_id: ${incoming.params.clientId}
    certificate_id: ${incoming.params.certificateId}
    ip_address: ${incoming.headers[Object.keys(incoming.headers).find(h => h.toLowerCase() === 'x-forwarded-for')] || 'unknown'}
  next: call_create_user_log_template

call_create_user_log_template:
  template: "[#CENTOPS_PROJECT_LAYER]/log-user-request"
  requestType: templates
  body:
    method: "DELETE"
    path: "admin/clients/certificates"
    ip_address: ${ip_address}
  headers:
    cookie: ${incoming.headers.cookie}
  result: log_cluster
  next: send_request

send_request:
  call: http.post
  args:
    url: "[#CENTOPS_RESQL]/delete-certificate"
    body:
      client_id: ${client_id}
      certificate_id: ${certificate_id}
  result: delete_result
  next: return_success

return_success:
  status: 204
  return:
  next: end

return_bad_request:
  status: 400
  return: "clientId, certificateId and cookie are required"
  next: end