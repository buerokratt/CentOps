declaration:
  call: declare
  version: 0.1
  description: "List all clients with minimal info"
  method: get
  accepts: json
  returns: json
  namespace: centops
  allowlist:
    params:
      - field: page
        type: number
      - field: pageSize
        type: number
      - field: sortOrder
        type: string
        description: "Sort order for name: 'asc' or 'desc'"
      - field: filterByName
        type: string
        description: "Filter clients by name (partial match)"

assign_parameters:
  assign:
    page: ${incoming.params.page ?? 1}
    page_size: ${incoming.params.pageSize ?? 10}
    sort_order: ${incoming.params.sortOrder ?? 'asc'}
    filter_by_name: ${incoming.params.filterByName ?? ''}

send_request:
  call: http.get
  args:
    url: "[#CENTOPS_RESQL]/get-client-list-with-minimal-info"
    query:
      page: ${page}
      page_size: ${page_size}
      sort_order: ${sort_order}
      filter_by_name: ${filter_by_name}
  result: clients_result

transform:
  call: http.post
  args:
    url: "[#CENTOPS_DMAPPER_HBS]/transform-clients-with-minimal-info"
    headers:
      type: "json"
    body:
      entries: ${clients_result.response.body}
      page: ${page}
      pageSize: ${page_size}
      sortOrder: ${sort_order}
      filterByName: ${filter_by_name}
  result: clients

return_clients:
  status: 200
  return: ${clients.response.body}
  next: end