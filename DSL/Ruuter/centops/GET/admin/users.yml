declaration:
  call: declare
  version: 0.1
  description: "List all users"
  method: get
  accepts: json
  returns: json
  namespace: centops
  allowlist:
    params:
      - field: page
        type: number
      - field: pageSize
        type: number

assign_parameters:
  assign:
    page: ${incoming.params.page ?? 1}
    page_size: ${incoming.params.pageSize ?? 10}

send_request:
  call: http.get
  args:
    url: "[#CENTOPS_RESQL]/get-user-list"
    query:
      page: ${page}
      page_size: ${page_size}
  result: users_result

transform:
  call: http.post
  args:
    url: "[#CENTOPS_DMAPPER_HBS]/transform-users"
    headers:
      type: "json"
    body:
      entries: ${users_result.response.body}
      page: ${page}
      pageSize: ${page_size}
  result: users

return_users:
  status: 200
  return: ${users.response.body}
  next: end