declaration:
  call: declare
  version: 0.1
  description: "List all users"
  method: get
  accepts: json
  returns: json
  namespace: centops

create_log:
  call: http.post
  args:
    url: "[#CENTOPS_RESQL]/create-user-log"
    body:
      method: "GET"
      path: "admin/users"
  result: get_user

list_users:
  call: http.get
  args:
    url: "[#CENTOPS_RESQL]/get-user-list"
  result: users_result

return_users:
  status: 200
  return: ${users_result.response.body}
  next: end