declaration:
  call: declare
  version: 0.1
  description: "List all clusters"
  method: get
  accepts: json
  returns: json
  namespace: centops
  allowlist:
    params:
      - field: page
        type: number
        description: "Page number for pagination"
      - field: pageSize
        type: number
        description: "Number of items per page"

extractRequestData:
  assign:
    page: ${incoming.params.page ?? 1}
    page_size: ${incoming.params.pageSize ?? 10}

list_clusters:
  call: http.get
  args:
    url: "[#CENTOPS_RESQL]/get-cluster-list"
    query:
      page: ${page}
      page_size: ${page_size}
  result: clusters_result

return_clusters:
  status: 200
  return: ${clusters_result.response.body}
  next: end