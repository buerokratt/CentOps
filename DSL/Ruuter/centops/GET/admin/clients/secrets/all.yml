declaration:
  call: declare
  version: 0.1
  description: "Get all secret list per client"
  method: get
  accepts: json
  returns: json
  namespace: centops
  allowlist:
    params:
      - field: clientId
        type: number
        description: "Unique client id"
      - field: page
        type: number
      - field: pageSize
        type: number

validate_request_param:
  switch:
    - condition: ${incoming.params.clientId == null }
      next: return_incorrect_request
  next: assign_parameters

assign_parameters:
  assign:
    clientId: ${incoming.params.clientId}
    page: ${incoming.params.page ?? 1}
    page_size: ${incoming.params.pageSize ?? 10}
  next: send_request

send_request:
  call: http.get
  args:
    url: "[#CENTOPS_RESQL]/get-client-secrets"
    query:
      client_id: ${clientId}
      page: ${page}
      page_size: ${page_size}
  result: secrets_result
  next: transform

transform:
  call: http.post
  args:
    url: "[#CENTOPS_DMAPPER_HBS]/transform-secrets"
    headers:
      type: "json"
    body:
      entries: ${secrets_result.response.body}
      page: ${page}
      pageSize: ${page_size}
  result: secrets
  next: return_secrets

return_secrets:
  return: ${secrets.response.body}
  next: end

return_incorrect_request:
  status: 400
  return: "clientId is required"
  next: end