declaration:
  call: declare
  version: 0.1
  description: "Get all secret list per client"
  method: get
  accepts: json
  returns: json
  namespace: centops
  allowlist:
    params:
      - field: clientId
        type: number
        description: "Unique client id"

check_for_required_parameters:
  switch:
    - condition: ${incoming.params.clientId == null }
      next: return_incorrect_request
  next: extract_request_data

extract_request_data:
  assign:
    clientId: ${incoming.params.clientId}
  next: get_client_secrets

get_client_secrets:
  call: http.get
  args:
    url: "[#CENTOPS_RESQL]/get-client-secrets"
    query:
      client_id: ${clientId}
  result: secrets_result
  next: return_success

return_success:
  wrapper: false
  return: ${secrets_result.response.body}
  next: end

return_incorrect_request:
  status: 400
  return: "Incorrect request, clientId must be provided"
  next: end