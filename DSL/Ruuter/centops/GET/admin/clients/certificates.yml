declaration:
  call: declare
  version: 0.1
  description: "List all certificates for a client"
  method: get
  accepts: json
  returns: json
  namespace: centops
  allowlist:
    params:
      - field: clientId
        type: string
      - field: page
        type: number
      - field: pageSize
        type: number

validate_request_param:
  switch:
    - condition: ${incoming.params.clientId == null}
      next: return_bad_request
  next: assign_parameters

assign_parameters:
  assign:
    client_id: ${incoming.params.clientId}
    page: ${incoming.params.page ?? 1}
    page_size: ${incoming.params.pageSize ?? 10}
  next: send_request

send_request:
  call: http.get
  args:
    url: "[#CENTOPS_RESQL]/get-certificate-list"
    query:
      client_id: ${client_id}
      page: ${page}
      page_size: ${page_size}
  result: certificates_result
  next: transform

transform:
  call: http.post
  args:
    url: "[#CENTOPS_DMAPPER_HBS]/transform-certificates"
    headers:
      type: "json"
    body:
      entries: ${certificates_result.response.body}
      page: ${page}
      pageSize: ${page_size}
  result: certificates
  next: return_certificates

return_certificates:
  status: 200
  return: ${certificates.response.body}
  next: end

return_bad_request:
  status: 400
  return: "clientId is required"
  next: end