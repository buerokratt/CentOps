declaration:
  call: declare
  version: 0.1
  description: "Get certificate metadata"
  method: get
  accepts: json
  returns: json
  namespace: centops
  allowlist:
    params:
      - field: clientId
        type: string
      - field: certificateId
        type: number

validate_request_param:
  switch:
    - condition: ${incoming.params.clientId == null || incoming.params.certificateId == null}
      next: return_bad_request
  next: assign_parameters

assign_parameters:
  assign:
    client_id: ${incoming.params.clientId}
    certificate_id: ${incoming.params.certificateId}
  next: send_request

send_request:
  call: http.get
  args:
    url: "[#CENTOPS_RESQL]/get-certificate"
    query:
      client_id: ${client_id}
      certificate_id: ${certificate_id}
  result: certificate_result
  next: check_result

check_result:
  switch:
    - condition: ${certificate_result.response.body[0] == null}
      next: return_not_found
  next: return_certificate

return_certificate:
  status: 200
  return: ${certificate_result.response.body[0]}
  next: end

return_bad_request:
  status: 400
  return: "clientId and certificateId are required"
  next: end

return_not_found:
  status: 404
  return: "Certificate not found"
  next: end