declaration:
  call: declare
  version: 0.1
  description: "Get user details"
  method: get
  accepts: json
  returns: json
  namespace: centops
  allowlist:
    params:
      - field: userId
        type: string

extract_request_data:
  assign:
    user_id: ${incoming.params.userId}
  next: validate_input

validate_input:
  switch:
    - condition: ${user_id == null}
      next: return_bad_request
  next: get_user

get_user:
  call: http.get
  args:
    url: "[#CENTOPS_RESQL]/get-user"
    query:
      user_id: ${user_id}
  result: user_result
  next: return_user

return_user:
  status: 200
  return: ${user_result.response.body}
  next: end

return_bad_request:
  status: 400
  return: "User ID is required"
  next: end