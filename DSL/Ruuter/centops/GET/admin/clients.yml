declaration:
  call: declare
  version: 0.1
  description: "List all clients"
  method: get
  accepts: json
  returns: json
  namespace: centops
  allowlist:
    params:
      - field: page
        type: number
        description: "Page number for pagination"
      - field: pageSize
        type: number
        description: "Number of items per page"

extractRequestData:
  assign:
    page: ${incoming.params.page ?? 1}
    page_size: ${incoming.params.pageSize ?? 10}

get_clients:
  call: http.get
  args:
    url: "[#CENTOPS_RESQL]/get-client-list"
    query:
      page: ${page}
      page_size: ${page_size}
  result: clients_result
  next: return_clients

return_clients:
  status: 200
  return: ${clients_result.response.body}
  next: end

return_incorrect_request:
  status: 400
  return: "Incorrect request"
  next: end