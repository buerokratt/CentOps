declaration:
  call: declare
  version: 0.1
  description: "Get cluster details"
  method: get
  accepts: json
  returns: json
  namespace: centops
  allowlist:
    params:
      - field: clusterId
        type: string

validate_request_param:
  switch:
    - condition: ${incoming.params.clusterId == null}
      next: return_bad_request
  next: assign_parameters

assign_parameters:
  assign:
    cluster_id: ${incoming.params.clusterId}
  next: send_request

send_request:
  call: http.get
  args:
    url: "[#CENTOPS_RESQL]/get-cluster"
    query:
      cluster_id: ${cluster_id}
  result: cluster_result
  next: check_result

check_result:
  switch:
    - condition: ${cluster_result.response.body[0] == null}
      next: return_not_found
  next: return_client

return_client:
  status: 200
  return: ${cluster_result.response.body[0]}
  next: end

return_bad_request:
  status: 400
  return: "clusterId is required"
  next: end

return_not_found:
  status: 404
  return: "Cluster not found"
  next: end