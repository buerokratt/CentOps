declaration:
  call: declare
  version: 0.1
  description: "Get documentation"
  method: get
  accepts: json
  returns: json
  namespace: centops

send_request:
  call: http.get
  args:
    url: "[#CENTOPS_RESQL]/get-documentation"
  result: docs_result
  next: check_result

check_result:
  switch:
    - condition: ${docs_result.response.body[0] == null}
      next: return_not_found
  next: return_documentation

return_documentation:
  status: 200
  return: ${docs_result.response.body[0]}
  next: end

return_not_found:
  status: 404
  return: "Documentation not found"
  next: end