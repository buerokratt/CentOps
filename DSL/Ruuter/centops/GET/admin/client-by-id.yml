declaration:
  call: declare
  version: 0.1
  description: "Get client details"
  method: get
  accepts: json
  returns: json
  namespace: centops
  allowlist:
    params:
      - field: clientId
        type: string

validate_name:
  switch:
    - condition: ${incoming.params.clientId == null}
      next: return_bad_request
  next: assign_parameters

assign_parameters:
  assign:
    client_id: ${incoming.params.clientId}
  next: send_request

send_request:
  call: http.get
  args:
    url: "[#CENTOPS_RESQL]/get-client"
    query:
      client_id: ${client_id}
  result: client_result
  next: return_client

return_client:
  status: 200
  return: ${client_result.response.body}
  next: end

return_bad_request:
  status: 400
  return: "Client ID is required"
  next: end