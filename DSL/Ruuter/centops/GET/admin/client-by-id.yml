declaration:
  call: declare
  version: 0.1
  description: "Get client details"
  method: get
  accepts: json
  returns: json
  namespace: centops
  endpoint: /client/get-client/{name}
  allowlist:
    params:
      - field: name
        type: string
        description: "Client name"
    headers:
      - field: cookie
        type: string
        description: "Cookie field"

get_user_info:
  call: http.post
  args:
    url: "[#CENTOPS_TIM]/jwt/custom-jwt-userinfo"
    contentType: plaintext
    headers:
      cookie: ${incoming.headers.cookie}
    plaintext: "customJwtCookie"
  result: res
  next: check_user_info_response

check_user_info_response:
  switch:
    - condition: ${200 <= res.response.statusCodeValue && res.response.statusCodeValue < 300}
      next: validate_name
  next: return_incorrect_request

validate_name:
  switch:
    - condition: ${incoming.params.name == null}
      next: return_bad_request
  next: assign_parameters

assign_parameters:
  assign:
    name: ${incoming.params.name}
  next: create_log

create_log:
  call: http.post
  args:
    url: "[#CENTOPS_RESQL]/create-user-log"
    body:
      method: "GET"
      path: "admin/client-by-id"
  result: send_request

send_request:
  call: http.get
  args:
    url: "[#CENTOPS_RESQL]/get-client"
    query:
      name: ${name}
  result: client_result
  next: return_client

return_client:
  status: 200
  return: ${client_result.response.body}
  next: end

return_bad_request:
  status: 400
  return: "Client name is required"
  next: end