declaration:
  call: declare
  version: 0.1
  description: "List all secret access logs"
  method: get
  accepts: json
  returns: json
  namespace: centops

get_logs:
  call: http.get
  args:
    url: "[#CENTOPS_RESQL]/get-secret-log-list"
  result: logs_result

return_logs:
  status: 200
  return: ${logs_result.response.body}
  next: end