declaration:
  call: declare
  version: 0.1
  description: "List all secret access logs"
  method: get
  accepts: json
  returns: json
  namespace: centops
  allowlist:
    params:
      - field: page
        type: number
      - field: pageSize
        type: number

extract_request_data:
  assign:
    page: ${incoming.params.page ?? 1}
    page_size: ${incoming.params.pageSize ?? 10}

send_request:
  call: http.get
  args:
    url: "[#CENTOPS_RESQL]/get-secret-log-list"
    query:
      page: ${page}
      page_size: ${page_size}
  result: logs_result

transform:
  call: http.post
  args:
    url: "[#CENTOPS_DMAPPER_HBS]/transform-secret-logs"
    headers:
      type: "json"
    body:
      entries: ${logs_result.response.body}
      page: ${page}
      pageSize: ${page_size}
  result: secret_logs

return_logs:
  status: 200
  return: ${secret_logs.response.body}
  next: end