declaration:
  call: declare
  version: 0.1
  description: "List all secret access logs"
  method: get
  accepts: json
  returns: json
  namespace: centops
  allowlist:
    params:
      - field: page
        type: number
        description: "Page number for pagination"
      - field: pageSize
        type: number
        description: "Number of items per page"

extractRequestData:
  assign:
    page: ${incoming.params.page ?? 1}
    page_size: ${incoming.params.pageSize ?? 10}

get_logs:
  call: http.get
  args:
    url: "[#CENTOPS_RESQL]/get-secret-log-list"
    query:
      page: ${page}
      page_size: ${page_size}
  result: logs_result

return_logs:
  status: 200
  return: ${logs_result.response.body}
  next: end