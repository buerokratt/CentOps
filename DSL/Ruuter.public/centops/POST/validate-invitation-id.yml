declaration:
  call: declare
  version: 0.1
  description: "Decription placeholder for 'validate-invitation-id'"
  method: post
  accepts: json
  returns: json
  namespace: centops
  allowlist:
    body:
      - field: invitationId
        type: string
        description: "Body field 'invitationId'"

check_for_invitation_id:
  switch:
    - condition: ${incoming.body == null || incoming.body.invitationId == null}
      next: return_incorrect_request

set_invitation_id:
  assign:
    invitation_id: ${incoming.body.invitationId}

get_invitation_id:
  call: http.post
  args:
    url: "[#CENTOPS_RESQL]/get-invitation-code-by-uuid"
    body:
      invitation_id: ${invitation_id}
  result: invitation

get_invitation_id_valid:
  switch:
    - condition: ${invitation.response.body[0] == null || invitation.response.body[0].invitationId == null}
      next: return_invitation_invalid

get_session_length:
  call: http.post
  args:
    url: "[#CENTOPS_RESQL_USERS]/get-configuration"
    body:
      key: "session_length"
  result: session_result
  next: generate_cookie

generate_cookie:
  call: http.post
  args:
    url: "[#CENTOPS_TIM]/jwt/custom-jwt-generate"
    body:
      JWTName: "customJwtCookie"
      expirationInMinutes: ${session_result.response.body[0]?.value ?? '120'}
      content: {
        "personalCode": "EE30303039914",
        "displayName": "Test User",
        "firstName": "Test",
        "lastName": "User",
        "authMethod": "smartId",
        "fullName": "Test User",
        "idCode": "EE30303039914",
        "login": "EE30303039914",
        "authorities": [
          "ROLE_ADMINISTRATOR",
          "ROLE_APPLICANT"
        ]
      }
  result: cookie_result

assign_cookie:
  assign:
    setCookie:
      customJwtCookie: ${cookie_result.response.body.token}
      Domain: "[#DOMAIN]"
      Secure: true
      HttpOnly: true
      SameSite: "[#COOKIE_SAME_SITE]"

return_ok:
  headers:
    Set-Cookie: ${setCookie}
  status: 200
  return: ""
  next: end

return_incorrect_request:
  status: 400
  return: "Invitation id is required"
  next: end


return_invitation_invalid:
  status: 404
  return: "Inserted invitation ID is not valid"
  next: end
