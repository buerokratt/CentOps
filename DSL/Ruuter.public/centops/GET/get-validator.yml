declaration:
  call: declare
  version: 0.1
  description: "Decription placeholder for 'get-validator'"
  method: get
  accepts: json
  returns: json
  namespace: centops
  allowlist:
    params:
      - field: validator_id
        type: string
        description: "Param field 'validator_id'"

check_params:
  switch:
    - condition: ${incoming.params == null || incoming.params.validator_id == null}
      next: return_incorrect_request

assign_file_path:
  assign:
    file_path: '/validators/${incoming.params.validator_id}.json'

get_form_validation_config_file:
  call: http.post
  args:
    url: "[#CENTOPS_DMAPPER]/file-manager/read"
    body:
      file_path: ${file_path}
  result: formResult

check_result:
  switch:
    - condition: ${formResult.response.body == null || formResult.response.body.error == true || formResult.response.body.data == null}
      next: return_bad_request
      
return_success:
  status: 200
  wrapper: false
  return: ${formResult.response.body.data}
  next: end

return_incorrect_request:
  status: 400
  return: "Missing required parameters"
  next: end

return_bad_request:
  status: 400
  return: "Bad request"
  next: end
