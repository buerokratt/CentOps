declaration:
  call: declare
  version: 0.1
  description: "Update cluster details"
  method: put
  accepts: json
  returns: json
  namespace: centops
  allowlist:
    body:
      - field: name
        type: string
      - field: ip_address
        type: string
      - field: argo_api_url
        type: string
      - field: argo_api_token
        type: string
    params:
      - field: cluster_id
        type: string

extract_request_data:
  assign:
    cluster_id: ${incoming.params.cluster_id}
    name: ${incoming.body.name}
    ip_address: ${incoming.body.ip_address}
    argo_api_url: ${incoming.body.argo_api_url}
    argo_api_token: ${incoming.body.argo_api_token}
  next: validate_input

validate_input:
  switch:
    - condition: ${cluster_id == null || name == null || ip_address == null || argo_api_url == null || argo_api_token == null}
      next: return_bad_request
  next: update_cluster

update_cluster:
  call: http.post
  args:
    url: "[#CENTOPS_RESQL]/update-cluster"
    body:
      cluster_id: ${cluster_id}
      name: ${name}
      ip_address: ${ip_address}
      argo_api_url: ${argo_api_url}
      argo_api_token: ${argo_api_token}
  result: update_result
  next: return_success

return_success:
  status: 204
  return:
  next: end

return_bad_request:
  status: 400
  return: "Cluster ID and all fields are required"
  next: end