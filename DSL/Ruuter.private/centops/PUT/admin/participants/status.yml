declaration:
  call: declare
  version: 0.1
  description: "Decription placeholder for 'status'"
  method: put
  accepts: json
  returns: json
  namespace: centops
  allowlist:
    params:
      - field: uuid
        type: string
        description: "Param field 'uuid'"
      - field: participantStatus
        type: string
        description: "Param field 'participantStatus'"  

check_for_parameters:
  switch:
    - condition: ${incoming.params.uuid == null || incoming.body.participantStatus == null}
      next: return_incorrect_request
  next: get_participant     

get_participant:
  call: http.post
  args:
    url: "[#CENTOPS_RESQL]/get-participant-by-id"
    body:
      unique_identifier: ${incoming.params.uuid}
  result: participant_result

assign_variables:
  assign:
    id: ${participant_result.response.body[0].id}
    institution_id: ${participant_result.response.body[0].institutionId}
    participant_type: ${participant_result.response.body[0].participantType}
    unique_identifier: ${incoming.params.uuid}
    participant_status: ${incoming.body.participantStatus}
    token: ${participant_result.response.body[0].securityToken}
    info: ${participant_result.response.body[0].info}

update_participant_status:
  call: http.post
  args:
    url: "[#CENTOPS_RESQL]/update-participant"
    body:
      id: ${id}
      institution_id: ${institution_id}
      participant_type: ${participant_type}
      participant_status: ${participant_status}
      unique_identifier: ${unique_identifier}
      security_token: ${token}
      info: ${info}
  result: update_result

return_ok:
  wrapper: false
  status: 200
  return: ${update_result.response.body}
  next: end

return_incorrect_request:
  status: 400
  return: "error: incorrect request"
  next: end
