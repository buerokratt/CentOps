declaration:
  call: declare
  version: 0.1
  description: "Create a new secret in Vault"
  method: post
  accepts: json
  returns: json
  namespace: centops
  allowlist:
    body:
      - field: path
        type: string
        description: "Path where the secret will be stored"
      - field: data
        type: object
        description: "Secret data to store"
    headers:
      - field: X-Vault-Token
        type: string
        description: "Vault authentication token"

check_for_required_parameters:
  switch:
    - condition: ${incoming.body.path == null || incoming.body.data == null || (incoming.headers != null && Object.keys(incoming.headers).find(h => h.toLowerCase() === 'x-vault-token') == null)}
      next: return_incorrect_request
  next: extract_request_data

extract_request_data:
  assign:
    path: ${incoming.body.path}
    data: ${incoming.body.data}
    vault_token: ${incoming.headers[Object.keys(incoming.headers).find(h => h.toLowerCase() === 'x-vault-token')]}
  next: send_request

send_request:
  call: http.post
  args:
    url: "[#VAULT_ADDR]/v1/cubbyhole/${path}"
    headers:
      X-Vault-Token: root
      Content-Type: application/json
    body:
      data: ${data}
  result: vault_result
  next: check_vault_response

check_vault_response:
  switch:
    - condition: ${200 <= vault_result.response.statusCodeValue && vault_result.response.statusCodeValue < 300}
      next: return_success
  next: return_vault_error

return_success:
  status: 201
  return: "Secret created successfully"
  next: end

return_vault_error:
  assign:
    has_response: ${vault_result != null && vault_result.response != null}
    has_body: ${has_response && vault_result.response.body != null}
    status_code: "${has_response ? vault_result.response.statusCodeValue : 500}"
    error_message: "${has_body ? vault_result.response.body.errors : ['Internal server error']}"
  status: ${status_code}
  return: ${error_message}
  next: end

return_incorrect_request:
  status: 400
  return: "Required parameters missing: path, data, and X-Vault-Token"
  next: end