declaration:
  call: declare
  version: 0.1
  description: "Create a new user"
  method: post
  accepts: json
  returns: json
  namespace: centops
  endpoint: /admin/users
  allowlist:
    body:
      - field: first_name
        type: string
      - field: last_name
        type: string
      - field: id_code
        type: string

get_user_info:
  call: http.post
  args:
    url: "[#CENTOPS_TIM]/jwt/custom-jwt-userinfo"
    contentType: plaintext
    headers:
      cookie: ${incoming.headers.cookie}
    plaintext: "customJwtCookie"
  result: res
  next: check_user_info_response

check_user_info_response:
  switch:
    - condition: ${200 <= res.response.statusCodeValue && res.response.statusCodeValue < 300}
      next: extract_request_data
  next: return_unauthorized

extract_request_data:
  assign:
    first_name: ${incoming.body.first_name}
    last_name: ${incoming.body.last_name}
    id_code: ${incoming.body.id_code}
  next: validate_input

validate_input:
  switch:
    - condition: ${first_name == null || last_name == null || id_code == null}
      next: return_bad_request
  next: create_user

create_user:
  call: http.post
  args:
    url: "[#CENTOPS_RESQL]/create-user"
    body:
      first_name: ${first_name}
      last_name: ${last_name}
      id_code: ${id_code}
  result: create_result
  next: return_created_user

return_created_user:
  status: 201
  return: "User created successfully"
  next: end

return_bad_request:
  status: 400
  return: "First name, last name and ID code are required"
  next: end

return_unauthorized:
  status: 401
  return: "Unauthorized"
  next: end