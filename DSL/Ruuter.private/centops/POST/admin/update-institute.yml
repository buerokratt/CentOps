declaration:
  call: declare
  version: 0.1
  description: "Decription placeholder for 'update-institute'"
  method: post
  accepts: json
  returns: json
  namespace: centops
  allowlist:
    body:
      - field: id
        type: string
        description: "Body field 'id'"
      - field: name
        type: string
        description: "Body field 'name'"
      - field: email
        type: string
        description: "Body field 'email'"

check_for_parameters:
  switch:
    - condition: ${incoming.body == null || incoming.body.id == null}
      next: return_incorrect_request

update_institute:
  call: http.post
  args:
    url: "[#CENTOPS_RESQL]/update-institute"
    body:
      id: ${incoming.body.id}
      name: ${incoming.body.name}
      email: ${incoming.body.email}
  result: update_result

return_ok:
  status: 204
  return: "updated successfully"
  next: end

return_incorrect_request:
  status: 400
  return: "error: incorrect request"
  next: end
