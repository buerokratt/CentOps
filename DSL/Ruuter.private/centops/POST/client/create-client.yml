declaration:
  call: declare
  version: 0.1
  description: "Create a new client"
  method: post
  accepts: json
  returns: json
  namespace: centops
  endpoint: /clients
  allowlist:
    body:
      - field: name
        type: string
      - field: kubernetes_cluster_address
        type: string
      - field: kubernetes_cluster_namespace
        type: string
      - field: hashicorp_vault_token
        type: string
      - field: authentication_certificate
        type: string

get_user_info:
  call: http.post
  args:
    url: "[#CENTOPS_TIM]/jwt/custom-jwt-userinfo"
    contentType: plaintext
    headers:
      cookie: ${incoming.headers.cookie}
    plaintext: "customJwtCookie"
  result: res
  next: check_user_info_response

check_user_info_response:
  switch:
    - condition: ${200 <= res.response.statusCodeValue && res.response.statusCodeValue < 300}
      next: validate_input
  next: return_incorrect_request

validate_input:
  switch:
    - condition: ${incoming.body.name == null || incoming.body.kubernetes_cluster_address == null || incoming.body.kubernetes_cluster_namespace == null || incoming.body.hashicorp_vault_token == null || incoming.body.authentication_certificate == null}
      next: return_bad_request
  next: create_client

create_client:
  call: http.post
  args:
    url: "[#CENTOPS_RESQL]/create-client"
    body:
      name: ${incoming.body.name}
      kubernetes_cluster_address: ${incoming.body.kubernetes_cluster_address}
      kubernetes_cluster_namespace: ${incoming.body.kubernetes_cluster_namespace}
      hashicorp_vault_token: ${incoming.body.hashicorp_vault_token}
      authentication_certificate: ${incoming.body.authentication_certificate}
      created: ${now()}
  result: create_result
  next: return_created_client

return_created_client:
  status: 201
  return: ${create_result.response.body}
  next: end

return_bad_request:
  status: 400
  return: "All fields are required"
  next: end

return_incorrect_request:
  status: 400
  return: "Incorrect request"
  next: end