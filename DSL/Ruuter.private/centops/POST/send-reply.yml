declaration:
  call: declare
  version: 0.1
  description: "Decription placeholder for 'send-reply'"
  method: post
  accepts: json
  returns: json
  namespace: centops
  allowlist:
    body:
      - field: message
        type: string
        description: "Body field 'message'"
      - field: type
        type: string
        description: "Body field 'type'"
      - field: reply_to_message_id
        type: string
        description: "Body field 'reply_to_message_id'"
      - field: receiver_id
        type: string
        description: "Body field 'receiver_id'"  
    headers:
      - field: cookie
        type: string
        description: "Cookie field"     
         
#
# TODO later: use validate-message template to validate the sender
#

get_user_info:
  call: http.post
  args:
   url: "[#CENTOPS_TIM]/jwt/custom-jwt-userinfo"
   contentType: plaintext
   headers:
    cookie: ${incoming.headers.cookie}
   plaintext: 
      "customJwtCookie"
  result: res
  next: check_user_info_response

check_user_info_response:
  switch:
    - condition: ${200 <= res.response.statusCodeValue && res.response.statusCodeValue < 300}
      next: assign_id_code
  next: return_incorrect_request

assign_id_code:
  assign:
    user_id: ${res.response.body.idCode}

check_for_body:
  switch:
    - condition: ${incoming.body == null}
      next: return_incorrect_request
  next: assign_info

assign_info:
  assign:
    message: ${incoming.body.message}
    type: ${incoming.body.type}
    reply_to_message_id: ${incoming.body.reply_to_message_id}
    receiver_id: ${incoming.body.receiver_id}
    sender_id: ${user_id}
  next: encrpyt_reply_message

encrpyt_reply_message:
  call: http.post
  args:
    url: "[#CENTOPS_RUUTER_PRIVATE]/templates/encryption/aes"
    body:
      content: ${message}
      key: 'test'
  result: encryptedMessageResult
  next: send_reply_message

send_reply_message:
  call: http.post
  args:
    url: "[#CENTOPS_RESQL]/send-reply-message"
    body: 
      message: ${message}
      type: ${type}
      receiver_id: ${receiver_id}
      sender_id: ${sender_id}
      reply_to_message_id: ${reply_to_message_id}
  result: messageResult
  next: return_ok

return_ok:
  wrapper: false
  status: 201
  return: "Message has been sent"
  next: end

return_incorrect_request:
  status: 400
  return: "User email is required"
  next: end
