declaration:
  call: declare
  version: 0.1
  description: "Create a new secret in Vault"
  method: post
  accepts: json
  returns: json
  namespace: centops
  allowlist:
    body:
      - field: path
        type: string
        description: "Path where the secret will be stored"
      - field: data
        type: object
        description: "Secret data to store"
    headers:
      - field: X-Vault-Token
        type: string
        description: "Vault authentication token"
      - field: User-Agent
        type: string
        description: "User agent of the client"
      - field: cookie
        type: string
        description: "Cookie field"

get_user_info:
  call: http.post
  args:
    url: "[#CENTOPS_TIM]/jwt/custom-jwt-userinfo"
    contentType: plaintext
    headers:
      cookie: ${incoming.headers.cookie}
    plaintext:
      "customJwtCookie"
  result: res
  next: check_user_info_response

check_user_info_response:
  switch:
    - condition: ${200 <= res.response.statusCodeValue && res.response.statusCodeValue < 300}
      next: assign_id_code
  next: return_incorrect_request

assign_id_code:
  assign:
    user_id: ${res.response.body.idCode}

check_for_required_parameters:
  switch:
    - condition: ${incoming.body.path == null || incoming.body.data == null || (incoming.headers != null && Object.keys(incoming.headers).find(h => h.toLowerCase() === 'x-vault-token') == null)}
      next: create_error_log
  next: extract_request_data

extract_request_data:
  assign:
    path: ${incoming.body.path}
    data: ${incoming.body.data}
    vault_token: ${incoming.headers[Object.keys(incoming.headers).find(h => h.toLowerCase() === 'x-vault-token')]}
    user_agent: ${incoming.headers[Object.keys(incoming.headers).find(h => h.toLowerCase() === 'user-agent')] || 'unknown'}
    ip_address: ${incoming.headers[Object.keys(incoming.headers).find(h => h.toLowerCase() === 'x-forwarded-for')] || 'unknown'}
  next: send_request

send_request:
  call: http.post
  args:
    url: "[#VAULT_ADDR]/v1/cubbyhole/${path}"
    headers:
      X-Vault-Token: ${vault_token}
      Content-Type: application/json
    body:
      data: ${data}
    error: create_error_log
  result: vault_result
  next: create_log_entry

create_log_entry:
  switch:
    - condition: ${200 <= vault_result.response.statusCodeValue && vault_result.response.statusCodeValue < 300}
      next: create_success_log
  next: create_error_log

create_success_log:
  call: http.post
  args:
    url: "[#CENTOPS_RESQL]/log-vault-api-post-success-action"
    body:
      client_id: ${user_id}
      ip_address: ${ip_address}
      action: "POST"
      secret_key: ${path}
      request_payload: ${data}
      user_agent: ${user_agent}
      status_code: ${vault_result.response.statusCodeValue}
  result: log_result
  next: return_success

create_error_log:
  assign:
    has_response: ${vault_result != null && vault_result.response != null}
    has_body: ${has_response && vault_result.response.body != null}
    status_code: "${has_response ? vault_result.response.statusCodeValue : 500}"
    error_message: "${has_body ? vault_result.response.body.errors : ['Internal server error']}"
  call: http.post
  args:
    url: "[#CENTOPS_RESQL]/log-vault-api-post-error-action"
    body:
      client_id: ${user_id}
      ip_address: ${ip_address}
      action: "POST"
      secret_key: ${path}
      request_payload: ${data}
      user_agent: ${user_agent}
      status_code: ${status_code}
      error_message: ${error_message}
  next: return_vault_error

return_success:
  status: 204
  return:
  next: end

return_vault_error:
  assign:
    has_response: ${vault_result != null && vault_result.response != null}
    has_body: ${has_response && vault_result.response.body != null}
    status_code: "${has_response ? vault_result.response.statusCodeValue : 500}"
    error_message: "${has_body ? vault_result.response.body.errors : ['Internal server error']}"
  status: ${status_code}
  return: ${error_message}
  next: end

return_incorrect_request:
  status: 400
  return: "Incorrect request"
  next: end