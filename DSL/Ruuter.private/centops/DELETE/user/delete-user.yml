declaration:
  call: declare
  version: 0.1
  description: "Delete a user"
  method: delete
  accepts: json
  returns: json
  namespace: centops
  allowlist:
    params:
      - field: user_id
        type: string

get_user_info:
  call: http.post
  args:
    url: "[#CENTOPS_TIM]/jwt/custom-jwt-userinfo"
    contentType: plaintext
    headers:
      cookie: ${incoming.headers.cookie}
    plaintext: "customJwtCookie"
  result: res
  next: check_user_info_response

check_user_info_response:
  switch:
    - condition: ${200 <= res.response.statusCodeValue && res.response.statusCodeValue < 300}
      next: validate_id_code
  next: return_unauthorized

validate_id_code:
  switch:
    - condition: ${incoming.params.user_id == null}
      next: return_bad_request
  next: delete_user

delete_user:
  call: http.post
  args:
    url: "[#CENTOPS_RESQL]/delete-user"
    body:
      user_id: ${incoming.params.user_id}
  result: delete_result
  next: return_deleted_user

return_deleted_user:
  status: 204
  return:
  next: end

return_bad_request:
  status: 400
  return: "User ID code is required"
  next: end

return_unauthorized:
  status: 401
  return: "Unauthorized"
  next: end