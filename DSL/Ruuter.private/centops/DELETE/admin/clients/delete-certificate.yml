declaration:
  call: declare
  version: 0.1
  description: "Delete/revoke a certificate"
  method: delete
  accepts: json
  returns: json
  namespace: centops

extract_request_data:
  assign:
    client_id: ${incoming.params.client_id}
    certificate_id: ${incoming.params.certificate_id}
  next: validate_input

validate_input:
  switch:
    - condition: ${client_id == null || certificate_id == null}
      next: return_bad_request
  next: delete_certificate

delete_certificate:
  call: http.post
  args:
    url: "[#CENTOPS_RESQL]/delete-certificate"
    body:
      client_id: ${client_id}
      certificate_id: ${certificate_id}
  result: delete_result
  next: return_success

return_success:
  status: 204
  return:
  next: end

return_bad_request:
  status: 400
  return: "Client ID and Certificate ID are required"
  next: end