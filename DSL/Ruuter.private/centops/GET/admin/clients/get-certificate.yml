declaration:
  call: declare
  version: 0.1
  description: "Get certificate metadata"
  method: get
  accepts: json
  returns: json
  namespace: centops

extract_request_data:
  assign:
    client_id: ${incoming.params.client_id}
    certificate_id: ${incoming.params.certificate_id}
  next: validate_input

validate_input:
  switch:
    - condition: ${client_id == null || certificate_id == null}
      next: return_bad_request
  next: get_certificate

get_certificate:
  call: http.get
  args:
    url: "[#CENTOPS_RESQL]/get-certificate"
    query:
      client_id: ${client_id}
      certificate_id: ${certificate_id}
  result: certificate_result
  next: return_certificate

return_certificate:
  status: 200
  return: ${certificate_result.response.body}
  next: end

return_bad_request:
  status: 400
  return: "Client ID and Certificate ID are required"
  next: end