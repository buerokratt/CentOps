declaration:
  call: declare
  version: 0.1
  description: "Get user details"
  method: get
  accepts: json
  returns: json
  namespace: centops
  endpoint: /admin/users/{user_id}
  allowlist:
    params:
      - field: user_id
        type: string

get_user_info:
  call: http.post
  args:
    url: "[#CENTOPS_TIM]/jwt/custom-jwt-userinfo"
    contentType: plaintext
    headers:
      cookie: ${incoming.headers.cookie}
    plaintext: "customJwtCookie"
  result: res
  next: check_user_info_response

check_user_info_response:
  switch:
    - condition: ${200 <= res.response.statusCodeValue && res.response.statusCodeValue < 300}
      next: extract_request_data
  next: return_unauthorized

extract_request_data:
  assign:
    user_id: ${incoming.params.user_id}
  next: validate_input

validate_input:
  switch:
    - condition: ${user_id == null}
      next: return_bad_request
  next: get_user

get_user:
  call: http.get
  args:
    url: "[#CENTOPS_RESQL]/get-user"
    query:
      user_id: ${user_id}
  result: user_result
  next: return_user

return_user:
  status: 200
  return: ${user_result.response.body}
  next: end

return_bad_request:
  status: 400
  return: "User ID is required"
  next: end

return_unauthorized:
  status: 401
  return: "Unauthorized"
  next: end