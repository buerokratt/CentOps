declaration:
  call: declare
  version: 0.1
  description: "List all users"
  method: get
  accepts: json
  returns: json
  namespace: centops
  endpoint: /admin/users

get_user_info:
  call: http.post
  args:
    url: "[#CENTOPS_TIM]/jwt/custom-jwt-userinfo"
    contentType: plaintext
    headers:
      cookie: ${incoming.headers.cookie}
    plaintext: "customJwtCookie"
  result: res
  next: check_user_info_response

check_user_info_response:
  switch:
    - condition: ${200 <= res.response.statusCodeValue && res.response.statusCodeValue < 300}
      next: list_users
  next: return_unauthorized

list_users:
  call: http.get
  args:
    url: "[#CENTOPS_RESQL]/get-user-list"
  result: users_result
  next: return_users

return_users:
  status: 200
  return: ${users_result.response.body}
  next: end

return_unauthorized:
  status: 401
  return: "Unauthorized"
  next: end