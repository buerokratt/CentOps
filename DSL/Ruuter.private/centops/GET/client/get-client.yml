declaration:
  call: declare
  version: 0.1
  description: "Get client details"
  method: get
  accepts: json
  returns: json
  namespace: centops
  endpoint: /client/get-client/{name}
  allowlist:
    params:
      - field: name
        type: string
        description: "Client name"

validate_name:
  switch:
    - condition: ${incoming.params.name == null}
      next: return_bad_request
  next: assign_parameters

assign_parameters:
  assign:
    name: ${incoming.params.name}
  next: send_request

send_request:
  call: http.get
  args:
    url: "[#CENTOPS_RESQL]/get-client?name=${name}"
  result: client_result
  next: return_client

return_client:
  status: 200
  return: ${client_result.response.body}
  next: end

return_bad_request:
  status: 400
  return: "Client name is required"
  next: end