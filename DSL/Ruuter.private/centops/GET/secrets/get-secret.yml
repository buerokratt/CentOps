declaration:
  call: declare
  version: 0.1
  description: "Get a secret from Vault by path"
  method: get
  accepts: json
  returns: json
  namespace: centops
  allowlist:
    params:
      - field: path
        type: string
        description: "Path to the secret in Vault"
    headers:
      - field: X-Vault-Token
        type: string
        description: "Vault authentication token"

check_for_required_parameters:
  switch:
    - condition: ${incoming.params.path == null || (incoming.headers != null && Object.keys(incoming.headers).find(h => h.toLowerCase() === 'x-vault-token') == null)}
      next: return_incorrect_request
  next: extract_request_data

extract_request_data:
  assign:
    path: ${incoming.params.path}
    vault_token: ${incoming.headers[Object.keys(incoming.headers).find(h => h.toLowerCase() === 'x-vault-token')]}
  next: get_secret_from_vault

get_secret_from_vault:
  call: http.get
  args:
    url: "[#VAULT_ADDR]/v1/cubbyhole/${path}"
    headers:
      X-Vault-Token: ${vault_token}
  result: vault_result
  next: check_vault_response

check_vault_response:
  switch:
    - condition: ${vault_result != null && vault_result.response != null && 200 <= vault_result.response.statusCodeValue && vault_result.response.statusCodeValue < 300}
      next: return_secret
  next: return_vault_error

return_secret:
  wrapper: false
  return: ${vault_result.response.body.data}
  next: end

return_vault_error:
  assign:
    has_response: ${vault_result != null && vault_result.response != null}
    has_body: ${has_response && vault_result.response.body != null}
    status_code: "${has_response ? vault_result.response.statusCodeValue : 500}"
    error_message: "${has_body ? vault_result.response.body.errors : ['Internal server error']}"
  status: ${status_code}
  return: ${error_message}
  next: end

return_incorrect_request:
  status: 400
  return: "Required parameters missing: path and X-Vault-Token"
  next: end