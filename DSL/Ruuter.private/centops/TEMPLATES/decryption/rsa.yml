declaration:
  call: declare
  version: 0.1
  description: "Decription placeholder for 'rsa'"
  method: post
  accepts: json
  returns: json
  namespace: centops
  allowlist:
    body:
      - field: cipher
        type: string
        description: "Body field 'cipher'"

rsa_decryption:
  call: http.post
  args:
    url: "[#CENTOPS_DMAPPER]/decryption/rsa"
    body:
      cipher: ${incoming.body.cipher}
  result: result

return_value:
  return: ${result.response.body.content}
  next: end
