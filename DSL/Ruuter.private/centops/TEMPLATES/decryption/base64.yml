declaration:
  call: declare
  version: 0.1
  description: "Decription placeholder for 'base64'"
  method: post
  accepts: json
  returns: json
  namespace: centops
  allowlist:
    body:
      - field: cipher
        type: string
        description: "Body field 'cipher'"
      - field: isObject
        type: string
        description: "Body field 'isObject'"  

base64_decryption:
  call: http.post
  args:
    url: "[#CENTOPS_DMAPPER]/decryption/base64"
    body:
      cipher: ${incoming.body.cipher}
      isObject: ${incoming.body.isObject}
  result: result

return_value:
  return: ${result.response.body.content}
  next: end
