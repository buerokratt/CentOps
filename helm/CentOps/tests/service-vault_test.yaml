suite: Test vault Service
templates:
  - service-vault.yaml
tests:
  - it: should render Service with default values
    set:
      namespace: default
      ports:
        vault: 8200
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: vault
      - equal:
          path: metadata.namespace
          value: default
      - equal:
          path: spec.selector.app
          value: vault
      - equal:
          path: spec.ports
          value:
            - port: 8200
              targetPort: 8200
              protocol: TCP
      - hasDocuments:
          count: 1

  - it: should render Service with custom values
    set:
      namespace: test-namespace
      ports:
        vault: 8201
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.namespace
          value: test-namespace
      - equal:
          path: metadata.name
          value: vault
      - equal:
          path: spec.ports
          value:
            - port: 8201
              targetPort: 8201
              protocol: TCP
      - hasDocuments:
          count: 1