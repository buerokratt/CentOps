suite: Test database-config ConfigMap
templates:
  - configmap-database.yaml
tests:
  - it: should render ConfigMap with default values
    set:
      namespace: default
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: database-config
      - equal:
          path: metadata.namespace
          value: default
      - equal:
          path: data.init-databases\.sh
          value: |
            #!/bin/sh
            psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" <<-EOSQL
                CREATE DATABASE users_db;
                CREATE DATABASE centops_db;
            EOSQL
      - hasDocuments:
          count: 1

  - it: should render ConfigMap with custom namespace
    set:
      namespace: test-namespace
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.namespace
          value: test-namespace
      - equal:
          path: metadata.name
          value: database-config
      - hasDocuments:
          count: 1