suite: Test vault PVC
templates:
  - pvc-vault.yaml
tests:
  - it: should render PVC with default values
    set:
      namespace: default
      volumes:
        vault:
          storage: "1Gi"
    asserts:
      - isKind:
          of: PersistentVolumeClaim
      - equal:
          path: metadata.name
          value: vault-pvc
      - equal:
          path: metadata.namespace
          value: default
      - equal:
          path: spec.accessModes
          value:
            - ReadWriteOnce
      - equal:
          path: spec.resources.requests.storage
          value: "1Gi"
      - hasDocuments:
          count: 1

  - it: should render PVC with custom values
    set:
      namespace: test-namespace
      volumes:
        vault:
          storage: "2Gi"
    asserts:
      - isKind:
          of: PersistentVolumeClaim
      - equal:
          path: metadata.namespace
          value: test-namespace
      - equal:
          path: metadata.name
          value: vault-pvc
      - equal:
          path: spec.resources.requests.storage
          value: "2Gi"
      - hasDocuments:
          count: 1