apiVersion: batch/v1
kind: Job
metadata:
  name: bootstrap-argocd
  namespace: {{ .Values.namespace | quote }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  template:
    spec:
      containers:
        - name: install-argocd
          image: bitnami/kubectl:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "Installing Argo CD into namespace {{ .Values.namespace }}..."
              kubectl apply -n {{ .Values.namespace }} -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
      restartPolicy: Never
  backoffLimit: 1
