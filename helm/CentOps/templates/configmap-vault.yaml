apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-config
  namespace: {{ .Values.namespace }}
data:
  config.hcl: |
    storage "file" {
      path = "/vault/data"
    }
    listener "tcp" {
      address = "0.0.0.0:8200"
      tls_disable = true
    }
    api_addr = "http://vault:8200"
    ui = true
  vault-agent.hcl: |
    pid_file = "/vault/pidfile"
    vault {
      address = "http://vault:8200"
    }
    auto_auth {
      method {
        type = "token_file"
        config {
          token_file_path = "/vault/secrets/.vault-token"
        }
      }
    }
    template {
      source      = "/vault/templates/database-template.ctmpl"
      destination = "/vault/secrets/database.env"
    }
    template {
      source      = "/vault/templates/resql-template.ctmpl"
      destination = "/vault/secrets/resql.env"
    }
    template {
      source      = "/vault/templates/resql-users-template.ctmpl"
      destination = "/vault/secrets/resql-users.env"
    }
    template {
      source      = "/vault/templates/tim-postgresql-template.ctmpl"
      destination = "/vault/secrets/tim-postgresql.env"
    }
  database-template.ctmpl: |
    {{`{{ with secret "secret/database" }}`}}
    POSTGRES_USER={{`{{ .Data.data.POSTGRES_USER }}`}}
    POSTGRES_PASSWORD={{`{{ .Data.data.POSTGRES_PASSWORD }}`}}
    POSTGRES_MULTIPLE_DATABASES={{`{{ .Data.data.POSTGRES_MULTIPLE_DATABASES }}`}}
    {{`{{ end }}`}}
  resql-template.ctmpl: |
    {{`{{ with secret "secret/resql" }}`}}
    sqlms.datasources[0].name={{`{{ .Data.data.sqlms_datasources_0_name }}`}}
    sqlms.datasources[0].jdbcUrl={{`{{ .Data.data.sqlms_datasources_0_jdbcUrl }}`}}
    sqlms.datasources[0].username={{`{{ .Data.data.sqlms_datasources_0_username }}`}}
    sqlms.datasources[0].password={{`{{ .Data.data.sqlms_datasources_0_password }}`}}
    {{`{{ end }}`}}
  resql-users-template.ctmpl: |
    {{`{{ with secret "secret/resql-users" }}`}}
    sqlms.datasources[0].name={{`{{ .Data.data.sqlms_datasources_0_name }}`}}
    sqlms.datasources[0].jdbcUrl={{`{{ .Data.data.sqlms_datasources_0_jdbcUrl }}`}}
    sqlms.datasources[0].username={{`{{ .Data.data.sqlms_datasources_0_username }}`}}
    sqlms.datasources[0].password={{`{{ .Data.data.sqlms_datasources_0_password }}`}}
    {{`{{ end }}`}}
  tim-postgresql-template.ctmpl: |
    {{`{{ with secret "secret/tim-postgresql" }}`}}
    POSTGRES_USER={{`{{ .Data.data.POSTGRES_USER }}`}}
    POSTGRES_PASSWORD={{`{{ .Data.data.POSTGRES_PASSWORD }}`}}
    POSTGRES_DB={{`{{ .Data.data.POSTGRES_DB }}`}}
    POSTGRES_HOST_AUTH_METHOD={{`{{ .Data.data.POSTGRES_HOST_AUTH_METHOD }}`}}
    {{`{{ end }}`}}