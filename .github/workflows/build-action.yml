name: Lint, Format, Build, Check Version

on:
  push:
    #branches: ["test", "stage", "main"]
    branches: ["add-github-action"]
  workflow_dispatch:

env:
  BRANCH: ${{ github.head_ref || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
      - uses: actions/checkout@v4

      - name: Setup Node.js
      - uses: actions/setup-node@v4
      - with:
      - node-version: '18'

      - name: Install dependencies
      - run: npm install

      - name: Run ESLint
      - run: npm run lint

      - name: Check Prettier formatting
      - run: npm run format

      - name: Build the project
      - run: npm run build
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Bump Patch Version
        run: npm run bump-patch
        if: ${{ env.BRANCH == 'test' }}

      - name: Sync Version
        run: npm run sync-version
        if: ${{ env.BRANCH != 'test' }}

      - name: Generate Changelog
        run: npm run changelog
        if: ${{ env.BRANCH == 'main' }}

      - name: Push changes to repo
        run: |
          git config --global user.name ${{ secrets.ADMIN_NAME }}
          git config --global user.email ${{ secrets.ADMIN_EMAIL }}
          git add .
          git commit -m "docs: update version [skip ci]"
          git push

      - name: Load environment variables
        run: |
          awk -v branch="${{ env.BRANCH }}" ' /^[0-9a-zA-Z]+$/ { current_branch = $0; } current_branch == branch && /^[A-Z_]+=/{ print $0; }' release.env >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: ${{ env.BRANCH == 'main' }}
        with:
          tag_name: v${{ env.MAJOR }}.${{ env.MINOR }}.${{ env.PATCH }}
          generate_release_notes: true
          body_path: ${{ github.workspace }}/CHANGELOG.md
